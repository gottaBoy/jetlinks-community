stream {
    upstream jetlinks_mqtt {
        least_conn;
        server node-1:1883;
        server node-2:1883;
        server node-3:1883;
    }

    upstream jetlinks_tcp {
        least_conn;
        server node-1:8800;
        server node-2:8800;
        server node-3:8800;
    }

    server {
        listen 1883;
        proxy_pass jetlinks_mqtt;
        proxy_connect_timeout 5s;
        proxy_timeout 30m;
    }

    server {
        listen 8800;
        proxy_pass jetlinks_tcp;
        proxy_connect_timeout 5s;
        proxy_timeout 30m;
    }
}
